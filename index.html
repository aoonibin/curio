<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>큐리오 Curio</title>
<meta name="description" content="엉뚱한 질문, 진짜 숫자로 계산합니다. 유튜브 쇼츠 채널 큐리오.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
  :root { --bg:#16130e; --panel:#221d15; --ink:#f3ede0; --dim:#b9b09d; --gold:#f2b632; --green:#3a9c44; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.7 'Noto Sans KR', sans-serif; }
  main { max-width:640px; margin:0 auto; padding:56px 16px 40px; text-align:center; }
  img.avatar { width:160px; height:160px; border-radius:50%; border:6px solid var(--green); object-fit:cover; display:block; margin:0 auto 20px; }
  h1 { font:72px/1.1 'Black Han Sans', sans-serif; color:var(--gold); margin:0; text-shadow:4px 6px 0 #000; -webkit-text-stroke:2px #000; }
  .en { font-weight:700; letter-spacing:.4em; color:var(--dim); margin:8px 0 28px; }
  p.lead { font-size:19px; margin:0 0 32px; }
  a.btn { display:inline-block; background:#d8392c; color:#fff; text-decoration:none; font-weight:700; padding:14px 28px; border-radius:999px; }
  a.btn:hover { background:#e94b3d; }
  footer { margin-top:56px; padding-top:20px; border-top:1px solid #3a3226; color:var(--dim); font-size:14px; }
  footer a { color:var(--dim); }
</style>
</head>
<body>
<main>
  <img class="avatar" src="profile.png" alt="큐리오 채널 프로필: 선글라스를 쓴 병민이">
  <h1>큐리오</h1>
  <div class="en">CURIO</div>
  <p class="lead">엉뚱한 질문, 진짜 숫자로 계산합니다.<br>궁금한 주제를 댓글로 남겨 주시면 다음 영상으로 만들어집니다!</p>
  <a class="btn" href="https://www.youtube.com/@curiokrtv">유튜브 채널 보기</a>
  <footer>
    <a href="privacy.html">개인정보처리방침 (Privacy Policy)</a>
  </footer>
</main>
</body>
</html>
